[project]
name = "factormine-plugin"
version = "0.1.0"
description = "本地 alpha 因子迭代挖掘流水线"
authors = [{ name = "factormine-plugin contributors" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "tools"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]